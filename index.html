<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#152a65">
  <title>CSI Event Companion · CSI AITR Student Chapter</title>
  <meta name="description" content="Discover, save and register for CSI AITR Student Chapter events.">
  <link rel="icon" type="image/png" href="assets/csi-logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#home" aria-label="CSI AITR home">
          <img src="assets/csi-logo.png" alt="CSI logo" width="46" height="46">
          <span><strong>CSI AITR</strong><small>STUDENT CHAPTER</small></span>
        </a>
        <nav class="desktop-nav" aria-label="Main navigation" id="desktop-nav"></nav>
        <div class="header-end"><span class="chapter-label">EVENT COMPANION</span><span class="avatar" aria-label="Student profile">S</span></div>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="footer-inner">
        <div><div class="footer-brand">CSI <span>AITR</span></div><p>Made for curious minds and the next big idea.</p><small>© 2026 CSI AITR Student Chapter</small></div>
        <div class="footer-col"><span>EXPLORE</span><a href="#events">All events</a><a href="#saved">Saved events</a><a href="#registrations">My registrations</a></div>
        <div class="footer-col footer-institute"><span>OUR INSTITUTE</span><img src="assets/aitr-logo.png" alt="Acropolis Institute of Technology and Research" width="196"></div>
      </div>
    </footer>
    <nav class="mobile-nav" aria-label="Mobile navigation" id="mobile-nav"></nav>
  </div>
  <dialog id="register-dialog" aria-labelledby="register-title">
    <div class="dialog-header"><div><span class="eyebrow">EVENT REGISTRATION</span><h2 id="register-title">Register for event</h2></div><button class="icon-button close-dialog" type="button" aria-label="Close registration">×</button></div>
    <p class="dialog-intro" id="register-event-name"></p>
    <form id="register-form">
      <label>Full name<input name="name" type="text" autocomplete="name" required placeholder="Your full name"></label>
      <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
      <label>Phone number<input name="phone" type="tel" inputmode="tel" pattern="[0-9+() -]{10,16}" required placeholder="10-digit phone number"></label>
      <label>College / Branch<input name="college" type="text" required placeholder="e.g. AITR / Computer Science"></label>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <button class="button button-primary full" type="submit">Submit Registration <span aria-hidden="true">→</span></button>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
